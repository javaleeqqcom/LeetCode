[project]
name = "leetcode-local-runner"
version = "0.8.0"
description = "Local OJ validation, RAG case generation, and persistent execution backends"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
source = ["agents", "rag", "runtime", "schemas", "tools"]
omit = ["Question/*", "old_codes/*", "build/*"]
